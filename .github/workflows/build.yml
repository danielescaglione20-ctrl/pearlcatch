name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # serve solo per creare la release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Permesso di esecuzione al wrapper
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Salva il jar come artifact
        uses: actions/upload-artifact@v4
        with:
          name: pearlcatch
          path: build/libs/*.jar

      # Solo quando fai un tag tipo v1.0.0: crea una Release con i jar
      - name: Crea Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
